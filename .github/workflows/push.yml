name: Render & Push Capybara Clock to Tidbyt

on:
  push:
    branches: [main]
    paths:
      - "capybara_clock.star"
      - ".github/workflows/push.yml"
  schedule:
    # Off-peak fallback cron (every 10 min); for exact 1-minute updates, trigger
    # workflow_dispatch via cron-job.org (see README.md).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      debug_weather:
        description: "Optional weather state override (auto, clear, partly_cloudy, overcast, fog, drizzle, freezing_rain, rain, rain_showers, snow, thunderstorm, thunderstorm_hail, windy)"
        required: false
        default: "auto"
      debug_time_of_day:
        description: "Optional time of day override (auto, day, night)"
        required: false
        default: "auto"
      debug_temp:
        description: "Optional temperature tier override (auto, warm, cold)"
        required: false
        default: "auto"
      foreground:
        description: "Set true to jump immediately to Capybara Clock on Tidbyt (default false updates silently in rotation)"
        required: false
        default: "false"

# Prevent overlapping pushes if a previous run is still finishing
concurrency:
  group: tidbyt-capybara-clock-push
  cancel-in-progress: true

env:
  PIXLET_VERSION: v0.34.0
  # Pre-render the upcoming minute N seconds before :00 so Tidbyt flips right on the minute!
  # Override anytime via repository variable CAPYBARA_PRE_RENDER_LEAD_SEC (e.g. 12..22, or 0 to disable).
  DEFAULT_PRE_RENDER_LEAD_SEC: "15"

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            capybara_clock.star
          sparse-checkout-cone-mode: false

      - name: Cache Pixlet binary
        id: cache-pixlet
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/pixlet
          key: pixlet-${{ env.PIXLET_VERSION }}-linux-amd64

      - name: Install Pixlet & libwebp runtime
        run: |
          mkdir -p ~/.local/bin
          if [ ! -x ~/.local/bin/pixlet ]; then
            echo "Downloading Pixlet ${PIXLET_VERSION}..."
            curl -fsSLO "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_VERSION}/pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz"
            tar -xzf "pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz" pixlet
            chmod +x pixlet
            mv pixlet ~/.local/bin/pixlet
            rm -f "pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          # Only install libwebp if pixlet fails to start due to missing shared libs
          if ! ~/.local/bin/pixlet version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libwebp-dev
          fi
          ~/.local/bin/pixlet version

      - name: Compute weather cache key (15-min buckets)
        id: wx-key
        env:
          LATITUDE: ${{ vars.CAPYBARA_LATITUDE }}
          LONGITUDE: ${{ vars.CAPYBARA_LONGITUDE }}
          ZIP_CODE: ${{ vars.CAPYBARA_ZIP_CODE }}
          TEMP_UNIT: ${{ vars.CAPYBARA_TEMP_UNIT }}
        run: |
          LOC_KEY="${LATITUDE:-40.6782}_${LONGITUDE:--73.9442}_${ZIP_CODE:-nozip}_${TEMP_UNIT:-F}"
          LOC_HASH="$(printf '%s' "$LOC_KEY" | sha256sum | cut -c1-12)"
          BUCKET="$(date -u +%Y%m%d%H)_$((10#$(date -u +%M) / 15))"
          echo "hash=${LOC_HASH}" >> "$GITHUB_OUTPUT"
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Cache weather data (15-min TTL + stale fallback)
        id: cache-weather
        uses: actions/cache@v4
        with:
          path: ~/.cache/capybara/weather.json
          key: weather-v1-${{ steps.wx-key.outputs.hash }}-${{ steps.wx-key.outputs.bucket }}
          restore-keys: |
            weather-v1-${{ steps.wx-key.outputs.hash }}-

      - name: Fetch weather (15-min cache, IPv4 + stale fallback)
        env:
          CACHE_HIT: ${{ steps.cache-weather.outputs.cache-hit }}
          LATITUDE: ${{ vars.CAPYBARA_LATITUDE }}
          LONGITUDE: ${{ vars.CAPYBARA_LONGITUDE }}
          ZIP_CODE: ${{ vars.CAPYBARA_ZIP_CODE }}
          TEMP_UNIT: ${{ vars.CAPYBARA_TEMP_UNIT }}
        run: |
          CACHE_FILE="${HOME}/.cache/capybara/weather.json"
          mkdir -p "${HOME}/.cache/capybara"

          if [ "$CACHE_HIT" = "true" ] && [ -s "$CACHE_FILE" ]; then
            cp "$CACHE_FILE" /tmp/weather.json
            echo "Weather cache hit (15-min bucket): $(cat /tmp/weather.json)"
            exit 0
          fi

          # Preserve any restored previous bucket as a fallback if Open-Meteo is unreachable
          if [ -s "$CACHE_FILE" ]; then
            cp "$CACHE_FILE" /tmp/weather_fallback.json
          fi

          LAT="${LATITUDE:-}"
          LON="${LONGITUDE:-}"
          if { [ -z "$LAT" ] || [ -z "$LON" ]; } && [ -n "$ZIP_CODE" ]; then
            ZIP_Q="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1].strip()))' "$ZIP_CODE")"
            if GEO_RAW="$(curl -4 -fsS --connect-timeout 6 --max-time 12 "https://geocoding-api.open-meteo.com/v1/search?name=${ZIP_Q}&count=1&language=en&format=json" 2>/dev/null)"; then
              read -r LAT LON < <(python3 -c 'import json, sys; r=(json.loads(sys.argv[1]).get("results") or [{}])[0]; print(r.get("latitude",""), r.get("longitude",""))' "$GEO_RAW" 2>/dev/null || true)
            fi
          fi
          LAT="${LAT:-40.6782}"
          LON="${LON:--73.9442}"
          UNIT_PARAM="fahrenheit"
          if [ "${TEMP_UNIT:-F}" = "C" ]; then
            UNIT_PARAM="celsius"
          fi

          URL="https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,wind_speed_10m,is_day&daily=sunrise,sunset&forecast_days=1&timezone=auto&temperature_unit=${UNIT_PARAM}"

          FETCHED=""
          for attempt in 1 2 3; do
            # Force IPv4 on attempts 1-2 (avoids Azure IPv6 stalls to Open-Meteo); allow dual-stack on attempt 3
            IP_FLAG="-4"
            [ "$attempt" -eq 3 ] && IP_FLAG=""
            if RAW="$(curl $IP_FLAG -fsS --connect-timeout 6 --max-time 12 "$URL" 2>&1)"; then
              if PARSED="$(python3 - "$RAW" <<'PYEOF'
          import json, sys
          data = json.loads(sys.argv[1])
          cur = data.get("current") or {}
          if "temperature_2m" not in cur:
              sys.exit(1)
          daily = data.get("daily") or {}
          sr = (daily.get("sunrise") or [""])[0]
          ss = (daily.get("sunset") or [""])[0]
          extract = lambda s: s.split("T")[1][:5] if ("T" in s and len(s.split("T")[1]) >= 5) else ""
          out = {
              "temp": cur.get("temperature_2m", 0.0),
              "code": cur.get("weather_code", 0),
              "wind": cur.get("wind_speed_10m", 0.0),
              "is_day": cur.get("is_day", 1),
              "sunrise": extract(sr),
              "sunset": extract(ss),
              "timezone": str(data.get("timezone", "")),
          }
          print(json.dumps(out, separators=(",", ":")))
          PYEOF
              )"; then
                FETCHED="$PARSED"
                break
              fi
            fi
            echo "Open-Meteo fetch attempt ${attempt} failed: ${RAW:-parse error}"
            [ "$attempt" -lt 3 ] && sleep 2
          done

          if [ -n "$FETCHED" ]; then
            printf '%s' "$FETCHED" > "$CACHE_FILE"
            printf '%s' "$FETCHED" > /tmp/weather.json
            echo "Fetched fresh weather: ${FETCHED}"
          else
            # Do not save a failed bucket to cache so the next minute retries Open-Meteo cleanly
            rm -f "$CACHE_FILE"
            if [ -s /tmp/weather_fallback.json ]; then
              cp /tmp/weather_fallback.json /tmp/weather.json
              echo "::warning::Open-Meteo timed out after 3 attempts; reusing last cached weather so clock stays on time."
            else
              printf 'none' > /tmp/weather.json
              echo "::warning::Open-Meteo timed out and no cached weather yet; rendering clock with fallback state."
            fi
          fi

      - name: Render capybara_clock.star to WebP
        env:
          LATITUDE: ${{ vars.CAPYBARA_LATITUDE }}
          LONGITUDE: ${{ vars.CAPYBARA_LONGITUDE }}
          ZIP_CODE: ${{ vars.CAPYBARA_ZIP_CODE }}
          TIMEZONE: ${{ vars.CAPYBARA_TIMEZONE }}
          USE_24H: ${{ vars.CAPYBARA_USE_24H }}
          TEMP_UNIT: ${{ vars.CAPYBARA_TEMP_UNIT }}
          LEAD_SEC: ${{ vars.CAPYBARA_PRE_RENDER_LEAD_SEC || env.DEFAULT_PRE_RENDER_LEAD_SEC }}
          FOREGROUND: ${{ github.event.inputs.foreground || 'false' }}
          DEBUG_WEATHER: ${{ github.event.inputs.debug_weather || 'auto' }}
          DEBUG_TIME_OF_DAY: ${{ github.event.inputs.debug_time_of_day || 'auto' }}
          DEBUG_TEMP: ${{ github.event.inputs.debug_temp || 'auto' }}
        run: |
          ARGS=()
          [ -n "$LATITUDE" ]          && ARGS+=("latitude=${LATITUDE}")
          [ -n "$LONGITUDE" ]         && ARGS+=("longitude=${LONGITUDE}")
          [ -n "$ZIP_CODE" ]          && ARGS+=("zip_code=${ZIP_CODE}")
          [ -n "$TIMEZONE" ]          && ARGS+=("timezone=${TIMEZONE}")
          [ -n "$USE_24H" ]           && ARGS+=("use_24h=${USE_24H}")
          [ -n "$TEMP_UNIT" ]         && ARGS+=("temp_unit=${TEMP_UNIT}")
          [ -n "$DEBUG_WEATHER" ]     && ARGS+=("debug_weather=${DEBUG_WEATHER}")
          [ -n "$DEBUG_TIME_OF_DAY" ] && ARGS+=("debug_time_of_day=${DEBUG_TIME_OF_DAY}")
          [ -n "$DEBUG_TEMP" ]        && ARGS+=("debug_temp=${DEBUG_TEMP}")
          if [ -s /tmp/weather.json ]; then
            ARGS+=("weather_json=$(cat /tmp/weather.json)")
          fi

          IS_DEBUG="false"
          if [ "$DEBUG_WEATHER" != "auto" ] || [ "$DEBUG_TIME_OF_DAY" != "auto" ] || [ "$DEBUG_TEMP" != "auto" ]; then
            IS_DEBUG="true"
          fi

          # On automated 1-minute triggers, wait until (60 - LEAD_SEC - 3)s and pre-render
          # the upcoming minute so the Tidbyt picks it up right at :00!
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FOREGROUND" != "true" ] && [ "$IS_DEBUG" != "true" ] && [ "${LEAD_SEC:-0}" -gt 0 ]; then
            TARGET_SEC=$((60 - LEAD_SEC - 3))
            SEC=$((10#$(date +%S)))
            if [ "$SEC" -lt "$TARGET_SEC" ]; then
              WAIT_SEC=$((TARGET_SEC - SEC))
              echo "Pre-render sync: waiting ${WAIT_SEC}s until :${TARGET_SEC} (push ~${LEAD_SEC}s before next minute)..."
              sleep "$WAIT_SEC"
            fi
            CLOCK_OFFSET=$((LEAD_SEC + 5))
            ARGS+=("clock_offset_sec=${CLOCK_OFFSET}")
          fi

          pixlet render capybara_clock.star "${ARGS[@]}" -o capybara_clock.webp
          ls -lh capybara_clock.webp

      - name: Push WebP to Tidbyt device
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_KEY: ${{ secrets.TIDBYT_API_KEY }}
          FOREGROUND: ${{ github.event.inputs.foreground || 'false' }}
          DEBUG_WEATHER: ${{ github.event.inputs.debug_weather || 'auto' }}
          DEBUG_TIME_OF_DAY: ${{ github.event.inputs.debug_time_of_day || 'auto' }}
          DEBUG_TEMP: ${{ github.event.inputs.debug_temp || 'auto' }}
        run: |
          if [ -z "$TIDBYT_DEVICE_ID" ] || [ -z "$TIDBYT_API_KEY" ]; then
            echo "::error::Missing TIDBYT_DEVICE_ID or TIDBYT_API_KEY repository secrets."
            exit 1
          fi

          # Update silently in rotation on automated 1-minute pushes;
          # push immediately to foreground on code push, explicit foreground=true, or debug preview runs.
          PUSH_ARGS=(
            --api-token "${TIDBYT_API_KEY}"
            --installation-id "capybaraclock"
          )
          IS_DEBUG="false"
          if [ "$DEBUG_WEATHER" != "auto" ] || [ "$DEBUG_TIME_OF_DAY" != "auto" ] || [ "$DEBUG_TEMP" != "auto" ]; then
            IS_DEBUG="true"
          fi
          if [ "${{ github.event_name }}" != "push" ] && [ "$FOREGROUND" != "true" ] && [ "$IS_DEBUG" != "true" ]; then
            PUSH_ARGS+=(--background)
          fi

          pixlet push "${PUSH_ARGS[@]}" "${TIDBYT_DEVICE_ID}" capybara_clock.webp
