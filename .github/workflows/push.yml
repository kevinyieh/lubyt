name: Render & Push Capybara Clock to Tidbyt

on:
  push:
    branches: [main]
    paths:
      - "capybara_clock.star"
      - ".github/workflows/push.yml"
  schedule:
    # Off-peak fallback cron (every 10 min); for exact 1-minute updates, trigger
    # workflow_dispatch via cron-job.org (see README.md).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      debug_weather:
        description: "Optional weather state override (auto, clear, partly_cloudy, overcast, fog, drizzle, freezing_rain, rain, rain_showers, snow, thunderstorm, thunderstorm_hail, windy)"
        required: false
        default: "auto"
      debug_time_of_day:
        description: "Optional time of day override (auto, day, night)"
        required: false
        default: "auto"
      debug_temp:
        description: "Optional temperature tier override (auto, warm, cold)"
        required: false
        default: "auto"
      foreground:
        description: "Set true to jump immediately to Capybara Clock on Tidbyt (default false updates silently in rotation)"
        required: false
        default: "false"

# Prevent overlapping pushes if a previous run is still finishing
concurrency:
  group: tidbyt-capybara-clock-push
  cancel-in-progress: true

env:
  PIXLET_VERSION: v0.34.0
  # Pre-render the upcoming minute N seconds before :00 so Tidbyt flips right on the minute!
  # Override anytime via repository variable CAPYBARA_PRE_RENDER_LEAD_SEC (e.g. 12..22, or 0 to disable).
  DEFAULT_PRE_RENDER_LEAD_SEC: "15"

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            capybara_clock.star
          sparse-checkout-cone-mode: false

      - name: Cache Pixlet binary
        id: cache-pixlet
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/pixlet
          key: pixlet-${{ env.PIXLET_VERSION }}-linux-amd64

      - name: Install Pixlet & libwebp runtime
        run: |
          mkdir -p ~/.local/bin
          if [ ! -x ~/.local/bin/pixlet ]; then
            echo "Downloading Pixlet ${PIXLET_VERSION}..."
            curl -fsSLO "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_VERSION}/pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz"
            tar -xzf "pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz" pixlet
            chmod +x pixlet
            mv pixlet ~/.local/bin/pixlet
            rm -f "pixlet_${PIXLET_VERSION#v}_linux_amd64.tar.gz"
          fi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          # Only install libwebp if pixlet fails to start due to missing shared libs
          if ! ~/.local/bin/pixlet version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libwebp-dev
          fi
          ~/.local/bin/pixlet version

      - name: Render capybara_clock.star to WebP
        env:
          LATITUDE: ${{ vars.CAPYBARA_LATITUDE }}
          LONGITUDE: ${{ vars.CAPYBARA_LONGITUDE }}
          ZIP_CODE: ${{ vars.CAPYBARA_ZIP_CODE }}
          TIMEZONE: ${{ vars.CAPYBARA_TIMEZONE }}
          USE_24H: ${{ vars.CAPYBARA_USE_24H }}
          TEMP_UNIT: ${{ vars.CAPYBARA_TEMP_UNIT }}
          LEAD_SEC: ${{ vars.CAPYBARA_PRE_RENDER_LEAD_SEC || env.DEFAULT_PRE_RENDER_LEAD_SEC }}
          FOREGROUND: ${{ github.event.inputs.foreground || 'false' }}
          DEBUG_WEATHER: ${{ github.event.inputs.debug_weather || 'auto' }}
          DEBUG_TIME_OF_DAY: ${{ github.event.inputs.debug_time_of_day || 'auto' }}
          DEBUG_TEMP: ${{ github.event.inputs.debug_temp || 'auto' }}
        run: |
          ARGS=()
          [ -n "$LATITUDE" ]          && ARGS+=("latitude=${LATITUDE}")
          [ -n "$LONGITUDE" ]         && ARGS+=("longitude=${LONGITUDE}")
          [ -n "$ZIP_CODE" ]          && ARGS+=("zip_code=${ZIP_CODE}")
          [ -n "$TIMEZONE" ]          && ARGS+=("timezone=${TIMEZONE}")
          [ -n "$USE_24H" ]           && ARGS+=("use_24h=${USE_24H}")
          [ -n "$TEMP_UNIT" ]         && ARGS+=("temp_unit=${TEMP_UNIT}")
          [ -n "$DEBUG_WEATHER" ]     && ARGS+=("debug_weather=${DEBUG_WEATHER}")
          [ -n "$DEBUG_TIME_OF_DAY" ] && ARGS+=("debug_time_of_day=${DEBUG_TIME_OF_DAY}")
          [ -n "$DEBUG_TEMP" ]        && ARGS+=("debug_temp=${DEBUG_TEMP}")

          IS_DEBUG="false"
          if [ "$DEBUG_WEATHER" != "auto" ] || [ "$DEBUG_TIME_OF_DAY" != "auto" ] || [ "$DEBUG_TEMP" != "auto" ]; then
            IS_DEBUG="true"
          fi

          # On automated 1-minute triggers, wait until (60 - LEAD_SEC - 3)s and pre-render
          # the upcoming minute so the Tidbyt picks it up right at :00!
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FOREGROUND" != "true" ] && [ "$IS_DEBUG" != "true" ] && [ "${LEAD_SEC:-0}" -gt 0 ]; then
            TARGET_SEC=$((60 - LEAD_SEC - 3))
            SEC=$((10#$(date +%S)))
            if [ "$SEC" -lt "$TARGET_SEC" ]; then
              WAIT_SEC=$((TARGET_SEC - SEC))
              echo "Pre-render sync: waiting ${WAIT_SEC}s until :${TARGET_SEC} (push ~${LEAD_SEC}s before next minute)..."
              sleep "$WAIT_SEC"
            fi
            CLOCK_OFFSET=$((LEAD_SEC + 5))
            ARGS+=("clock_offset_sec=${CLOCK_OFFSET}")
          fi

          # Retry up to 3 times in case Open-Meteo has a brief transient timeout
          for attempt in 1 2 3; do
            if pixlet render capybara_clock.star "${ARGS[@]}" -o capybara_clock.webp; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pixlet render failed after 3 attempts."
              exit 1
            fi
            echo "Render attempt ${attempt} failed (transient API timeout); retrying in 3s..."
            sleep 3
          done
          ls -lh capybara_clock.webp

      - name: Push WebP to Tidbyt device
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_KEY: ${{ secrets.TIDBYT_API_KEY }}
          FOREGROUND: ${{ github.event.inputs.foreground || 'false' }}
          DEBUG_WEATHER: ${{ github.event.inputs.debug_weather || 'auto' }}
          DEBUG_TIME_OF_DAY: ${{ github.event.inputs.debug_time_of_day || 'auto' }}
          DEBUG_TEMP: ${{ github.event.inputs.debug_temp || 'auto' }}
        run: |
          if [ -z "$TIDBYT_DEVICE_ID" ] || [ -z "$TIDBYT_API_KEY" ]; then
            echo "::error::Missing TIDBYT_DEVICE_ID or TIDBYT_API_KEY repository secrets."
            exit 1
          fi

          # Update silently in rotation on automated 1-minute pushes;
          # push immediately to foreground on code push, explicit foreground=true, or debug preview runs.
          PUSH_ARGS=(
            --api-token "${TIDBYT_API_KEY}"
            --installation-id "capybaraclock"
          )
          IS_DEBUG="false"
          if [ "$DEBUG_WEATHER" != "auto" ] || [ "$DEBUG_TIME_OF_DAY" != "auto" ] || [ "$DEBUG_TEMP" != "auto" ]; then
            IS_DEBUG="true"
          fi
          if [ "${{ github.event_name }}" != "push" ] && [ "$FOREGROUND" != "true" ] && [ "$IS_DEBUG" != "true" ]; then
            PUSH_ARGS+=(--background)
          fi

          pixlet push "${PUSH_ARGS[@]}" "${TIDBYT_DEVICE_ID}" capybara_clock.webp
